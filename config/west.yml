    - name: zmk-dongle-screen
      remote: yoshimaru46-fork
      revision: add-key-status-widget   # janpfischer/upgrade-4.1 (ZMK main/Zephyr4用) + 押下キー表示ウィジェット
      clone-depth: 1
  self:
    path: config
